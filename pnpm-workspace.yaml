packages:
  - apps/*
  - libs/*

catalogMode: prefer
catalogPrune: true

catalog:
  '@changesets/changelog-github': '0.5.0'
  '@changesets/cli': '2.27.12'
  '@cloudflare/vite-plugin': '1.62.5'
  '@oyolincc/cli': '2.1.4'
  '@oyolincc/dev-config': '0.1.1'
  '@oyolincc/env-loader': '^0.2.0'
  '@rollup/pluginutils': '^5.4.0'
  '@types/node': '^24'
  '@vitejs/plugin-react': '^6.0.3'
  'concurrently': '^10.0.5'
  'dotenv': '17.2.3'
  'fast-glob': '^3.3.3'
  'nitro': '3.0.260610-beta'
  'tsx': '4.21.0'
  'turbo': '^2.9.14'
  'typescript': '7.0.2'
  'vite': 'npm:@voidzero-dev/vite-plus-core@1.1.0'
  'vite-plus': '1.1.0'
  'wrangler': '4.147.0'

catalogs:
  shared:
    '@types/string-template': '^1.0.7'
    'change-case': '^5.4.4'
    'defu': '^6.1.7'
    'ky': '^2.0.2'
    'string-template': '^1.0.0'
    'valibot': '^1.4.2'
    'yaml': '^2.8.1'
  server:
    '@hono/node-server': '^2.1.0'
    '@hono/standard-validator': '^0.4.0'
    '@hono/swagger-ui': '^0.6.1'
    '@hono/vite-dev-server': '^0.26.1'
    '@valibot/to-json-schema': '^1.7.1'
    'hono': '^4.13.1'
    'hono-openapi': '^1.3.3'
    'hono-pino': '^0.10.3'
    'hono-problem-details': '^0.11.0'
    'pino': '^10.3.1'
    'pino-pretty': '^13.1.3'
    'pino-roll': '^4.0.0'
    'piscina': '^5.3.0'
  frontend:
    '@tailwindcss/vite': '^4.3.3'
    '@tanstack/react-query': '^5.90.21'
    '@tanstack/react-query-devtools': '^5.102.8'
    '@tanstack/react-router': '^1.170.19'
    '@tanstack/react-router-devtools': '^1.167.1'
    '@tanstack/react-start': '^1.168.52'
    '@tanstack/router-cli': '^1.167.18'
    '@types/react': '19.2.17'
    '@types/react-dom': '19.2.3'
    'jotai': '^2.18.0'
    'react': '19.2.7'
    'react-dom': '19.2.7'
    'tailwindcss': '^4.3.3'
  db:
    '@types/better-sqlite3': '^7.6.13'
    'better-sqlite3': '^12.11.1'
    'drizzle-kit': '1.0.0-rc.4'
    'drizzle-orm': '1.0.0-rc.4'

overrides:
  'vite@*': 'catalog:'

peerDependencyRules:
  allowAny:
    - 'vite'
  allowedVersions:
    'vite': '*'

allowBuilds:
  'better-sqlite3': true
  'esbuild': true
  'workerd': true

minimumReleaseAgeExclude:
  - '@oyolincc/cli@2.1.4'
  - '@oyolincc/code-gen@0.3.0'
